<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도치마켓</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b10;
  color: white;
}

header {
  text-align: center;
  padding: 55px 20px;
  background: #15121f;
}

header h1 {
  font-size: 42px;
  margin: 0 0 10px;
  color: #a970ff;
}

header p {
  color: #aaa;
  font-size: 16px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 45px 20px;
}

.section-title {
  font-size: 28px;
  margin-bottom: 25px;
}

.product {
  background: #171720;
  border: 1px solid #302d3d;
  border-radius: 20px;
  padding: 35px;
  text-align: center;
  max-width: 500px;
  margin: auto;
}

.product-icon {
  font-size: 70px;
  margin-bottom: 15px;
}

.product h2 {
  font-size: 30px;
  margin: 10px 0;
}

.price {
  font-size: 25px;
  font-weight: bold;
  color: #a970ff;
  margin: 15px 0;
}

.stock {
  color: #ff6b6b;
  font-size: 18px;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #555;
  color: #aaa;
  font-size: 18px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 35px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>도치마켓</h1>
  <p>빠르고 편리한 온라인 자판기</p>
</header>

<div class="container">

  <div class="section-title">🛒 상품</div>

  <div class="product">

    <div class="product-icon">🥚</div>

    <h2>크리스탈 에그</h2>

    <div class="price">
      가격 준비중
    </div>

    <div class="stock">
      📦 품절
    </div>

    <button disabled>
      품절
    </button>

  </div>

</div>

<footer>
  © 2026 도치마켓
</footer>

</body>
</html>
